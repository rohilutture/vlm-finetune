# Step 2: GRPO with the exact verifier as the reward. Set init_adapter to the SFT adapter to continue from it (the
# reference is then a frozen copy of that adapter); leave it null to start from the base model.
model_path: Qwen/Qwen2.5-VL-3B-Instruct
init_adapter: runs/sft/adapter
out_dir: runs/grpo_sft
lora: {r: 16, alpha: 32, dropout: 0.0}      # used only when init_adapter is null
data: {n_train: 20000, n_eval: 300}
train: {steps: 150, prompts_per_step: 4, group_size: 8, max_new_tokens: 160, temperature: 1.0, lr: 1.0e-5,
        beta: 0.02, clip: 0.2, micro_batch: 4, scale_std: true, length_norm: seq, skip_degenerate: true,
        eval_every: 50, save_every: 100, seed: 0}
